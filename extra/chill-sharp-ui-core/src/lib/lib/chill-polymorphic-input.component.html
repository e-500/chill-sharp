<div class="polymorphic-fields">
  @for (property of properties(); track property.name) {
    <label class="field">
      @if (showLabels()) {
        <span>{{ property.displayName || property.name }}</span>
      }

      @if (isCheckbox(property)) {
        @if (control(property.name); as fieldControl) {
          <app-chill-polymorphic-boolean-control
            [control]="fieldControl"
            [name]="property.name"
            [readOnly]="isPropertyReadOnly(property.name)"
            (blur)="emitFieldBlur(property.name)" />
        }
      } @else if (isLookupCollection(property) || isLookup(property)) {
        <app-chill-polymorphic-lookup-control
          [property]="property"
          [readOnly]="isPropertyReadOnly(property.name)"
          [placeholder]="placeholder(property)"
          [term]="lookupTerm(property.name)"
          [results]="lookupResults(property.name)"
          [error]="lookupError(property.name)"
          [searching]="lookupIsSearching(property.name)"
          [selectedEntities]="selectedLookupCollectionEntities(property.name)"
          [selectedLabel]="selectedLookupLabel(property.name)"
          [selectedShortLabel]="selectedLookupShortLabel(property.name)"
          [selectedGuid]="selectedLookupEntity(property.name) ? lookupGuid(selectedLookupEntity(property.name)!) : ''"
          [hasSelectedEntity]="hasSelectedLookupEntity(property.name)"
          [canOpenDialog]="canOpenLookupDialog(property)"
          [positions]="lookupOverlayPositions"
          (termChange)="updateLookupTerm(property, $event)"
          (focus)="handleLookupFocus(property)"
          (blur)="handleLookupBlur(property.name)"
          (beginDialog)="beginLookupDialogSelection(property.name)"
          (openDialog)="openLookupDialog(property)"
          (clear)="clearLookup(property)"
          (select)="selectLookupResult(property, $event)"
          (remove)="removeLookupCollectionEntity(property, $event)" />
      } @else if (isTextarea(property)) {
        @if (control(property.name); as fieldControl) {
          <app-chill-polymorphic-textarea-control
            [control]="fieldControl"
            [name]="property.name"
            [placeholder]="placeholder(property)"
            [readOnly]="isPropertyReadOnly(property.name)"
            (blur)="emitFieldBlur(property.name)" />
        }
      } @else if (isJsonEditor(property)) {
        <app-chill-polymorphic-editor-control
          [value]="textValue(property.name)"
          [language]="editorLanguage(property)"
          [placeholder]="placeholder(property)"
          [invalid]="!!validationMessage(property.name)"
          [disabled]="isPropertyReadOnly(property.name) || (control(property.name)?.disabled ?? false)"
          (valueChange)="updateJsonInput(property.name, $event)"
          (blur)="emitFieldBlur(property.name)"
          (beginDialog)="beginEditorDialogSelection(property.name)"
          (openDialog)="openEditorDialog(property)" />
      } @else if (isSelect(property)) {
        <app-chill-polymorphic-select-control
          [name]="property.name"
          [value]="selectValue(property.name)"
          [options]="selectOptions(property)"
          [readOnly]="isPropertyReadOnly(property.name)"
          (valueChange)="updateSelectValue(property, $event)" />
      } @else {
        @if (control(property.name); as fieldControl) {
          <app-chill-polymorphic-scalar-control
            [control]="fieldControl"
            [name]="property.name"
            [placeholder]="placeholder(property)"
            [readOnly]="isPropertyReadOnly(property.name)"
            [formatted]="isFormattedTextInput(property)"
            [value]="textValue(property.name)"
            [type]="inputType(property)"
            [step]="inputStep(property)"
            (valueChange)="updateTextInput(property.name, $event)"
            (blur)="normalizeTextOnBlur(property)" />
        }
      }

      @if (validationMessage(property.name)) {
        <small class="field-error">{{ validationMessage(property.name) }}</small>
      }
    </label>
  }
</div>
