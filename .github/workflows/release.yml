name: Publish release packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-test-pack-publish:
    name: Build, test, pack, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The solution also contains ChillSharp.Template, which deliberately consumes
      # ChillSharp from NuGet.org. It cannot be restored before this release exists.
      - name: Restore release projects
        run: dotnet restore ChillSharp.Test/ChillSharp.Test.csproj

      - name: Test
        run: dotnet test ChillSharp.Test/ChillSharp.Test.csproj --configuration Release --no-restore

      - name: Pack ChillSharp
        run: dotnet pack ChillSharp/ChillSharp.csproj --configuration Release --no-restore --output artifacts

      - name: Pack ChillSharp.Client
        run: dotnet pack ChillSharp.Client/ChillSharp.Client.csproj --configuration Release --no-restore --output artifacts

      - name: Log in to NuGet.org with OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: e-500

      - name: Publish packages to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  build-python-client:
    name: Build Python client
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python distribution
        working-directory: extra/chill-sharp-py-client
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist

      - name: Upload Python distribution
        uses: actions/upload-artifact@v4
        with:
          name: chill-sharp-py-client
          path: extra/chill-sharp-py-client/dist/
          if-no-files-found: error

  publish-python-client:
    name: Publish Python client to PyPI
    needs: build-python-client
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chill-sharp-py-client
    permissions:
      id-token: write

    steps:
      - name: Download Python distribution
        uses: actions/download-artifact@v4
        with:
          name: chill-sharp-py-client
          path: dist/

      - name: Publish Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  build-npm-packages:
    name: Build npm packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build npm package distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p npm-dist
          for package_dir in \
            extra/chill-sharp-ts-client \
            extra/chill-sharp-ng-client \
            extra/chill-sharp-react-client \
            extra/chill-sharp-vue-client; do
            (
              cd "$package_dir"
              npm ci
              npm run build
              npm pack --ignore-scripts --pack-destination ../../npm-dist
            )
          done

          (
            cd extra/chill-sharp-ui-core
            npm install --no-save \
              "file://$(realpath ../../npm-dist/chill-sharp-ts-client-*.tgz)" \
              "file://$(realpath ../../npm-dist/chill-sharp-ng-client-*.tgz)"
            npm run build
            npm pack dist --pack-destination ../../npm-dist
          )

          (
            cd extra/chill-sharp-create-app
            npm pack --ignore-scripts --pack-destination ../../npm-dist
          )

      - name: Upload npm package distributions
        uses: actions/upload-artifact@v4
        with:
          name: chill-sharp-npm-packages
          path: npm-dist/*.tgz
          if-no-files-found: error

  publish-npm-packages:
    name: Publish npm packages
    needs: build-npm-packages
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download npm package distributions
        uses: actions/download-artifact@v4
        with:
          name: chill-sharp-npm-packages
          path: npm-dist/

      - name: Publish npm packages
        shell: bash
        run: |
          set -euo pipefail
          for package_archive in \
            npm-dist/chill-sharp-ts-client-*.tgz \
            npm-dist/chill-sharp-ng-client-*.tgz \
            npm-dist/chill-sharp-ui-core-*.tgz \
            npm-dist/chill-sharp-react-client-*.tgz \
            npm-dist/chill-sharp-vue-client-*.tgz \
            npm-dist/chill-sharp-create-app-*.tgz; do
            npm publish "$package_archive" --access public
          done
